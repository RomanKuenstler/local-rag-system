x-node-service: &node-service
  build:
    context: .
    dockerfile: Dockerfile
  develop:
    watch:
      - action: sync
        path: ./
        target: /app
        initial_sync: true
        ignore:
          - node_modules/

services:
  backend:
    <<: *node-service
    environment:
      APP_ROLE: backend
      BACKEND_API_PORT: 3100
      RETRIEVER_BASE_URL: http://retriever:3000
      EMBEDDER_BASE_URL: http://embedder:3200
    ports:
      - "3100:3100"
    command: ["npm", "run", "start:backend:api"]
    depends_on:
      - retriever
      - embedder

  retriever:
    <<: *node-service
    environment:
      APP_ROLE: retriever
      TERM: xterm-256color
      HISTORY_MESSAGES: 2
      MIN_SIMILARITIES: 2
      MAX_SIMILARITIES: 5
      COSINE_LIMIT: 0.55
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
      OPTION_TEMPERATURE: 0.0
      OPTION_TOP_P: 0.9
      OPTION_PRESENCE_PENALTY: 2.2
      CONTENT_PATH: /app/data
      INDEX_STATE_FILE: /app/state/.index-state.json
      EMBEDDING_STATUS_FILE: /app/state/.embedding-status.json
      CHAT_HISTORY_DIR: /app/state/chat-history
      RETRIEVER_API_PORT: 3000
    volumes:
      - ./data:/app/data
      - ./upload:/app/upload
      - rag_state:/app/state
    configs:
      - source: guardrails.md
        target: /app/guardrails.md
    models:
      chat-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_CHAT
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
    command: ["npm", "run", "start:retriever:api"]
    depends_on:
      - qdrant
      - embedder

  embedder:
    <<: *node-service
    environment:
      APP_ROLE: embedder
      CONTENT_PATH: /app/data
      INDEX_STATE_FILE: /app/state/.index-state.json
      EMBEDDING_STATUS_FILE: /app/state/.embedding-status.json
      EMBED_INTERVAL_SECONDS: 15
      EMBEDDER_HEALTH_PORT: 3200
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
    volumes:
      - ./data:/app/data
      - rag_state:/app/state
    models:
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
    depends_on:
      - qdrant

  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    environment:
      UPSTREAM_API_URL: http://backend:3100
    ports:
      - "5173:80"
    develop:
      watch:
        - action: sync
          path: ./webui
          target: /usr/share/nginx/html
          initial_sync: true
          ignore:
            - Dockerfile
            - nginx.conf.template
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  rag_state:

models:
  chat-model:
    model: hf.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M
  embedding-model:
    model: ai/embeddinggemma:latest

configs:
  guardrails.md:
    file: ./guardrails.md
