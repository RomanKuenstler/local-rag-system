services:
  retriever:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: retriever
      TERM: xterm-256color
      HISTORY_MESSAGES: 2
      MIN_SIMILARITIES: 2
      MAX_SIMILARITIES: 5
      COSINE_LIMIT: 0.55
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
      OPTION_TEMPERATURE: 0.0
      OPTION_TOP_P: 0.9
      OPTION_PRESENCE_PENALTY: 2.2
      CONTENT_PATH: /app/data
      INDEX_STATE_FILE: /app/state/.index-state.json
      CHAT_HISTORY_DIR: /app/state/chat-history
    volumes:
      - ./data:/app/data
      - rag_state:/app/state
    stdin_open: true
    tty: true
    configs:
      - source: system.instructions.md
        target: /app/system.instructions.md
    models:
      chat-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_CHAT
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
    depends_on:
      - qdrant

  embedder:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: embedder
      CONTENT_PATH: /app/data
      INDEX_STATE_FILE: /app/state/.index-state.json
      EMBED_INTERVAL_SECONDS: 15
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
    volumes:
      - ./data:/app/data
      - rag_state:/app/state
    models:
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  rag_state:

models:
  chat-model:
   model: hf.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M
  embedding-model:
    model: ai/embeddinggemma:latest

configs:
  system.instructions.md:
    content: |
      You are Bob, a helpful AI assistant operating inside a Retrieval Augmented Generation (RAG) system.

      Your main task is to answer the user's question using information retrieved from a KNOWLEDGE BASE.

      The KNOWLEDGE BASE contains pieces of text retrieved from documents that may be relevant to the user's question. These pieces of text are provided as context and may include metadata such as source, section, similarity score, or other information.

      Treat the retrieved information as evidence.

      General behavior:

      1. The retrieved knowledge is your primary source of information.
      2. Prefer information from the knowledge base over your general knowledge whenever possible.
      3. When multiple pieces of retrieved information are provided, combine them logically into a coherent answer.
      4. Ignore retrieved information that is clearly irrelevant to the user's question.
      5. Do NOT invent facts that are not supported by the retrieved knowledge.

      Handling incomplete information:

      - If the retrieved knowledge only partially answers the question, answer only the supported parts and clearly indicate what information is missing.
      - If the retrieved knowledge does not contain enough information to answer the question, say so explicitly.

      General knowledge fallback:

      If the knowledge base does not contain enough relevant information, you may provide an answer based on general knowledge, but you must clearly state that the answer is not based on the knowledge base.

      For example:
      "The knowledge base does not contain enough information about this topic. Based on general knowledge..."
