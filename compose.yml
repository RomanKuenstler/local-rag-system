services:
  retriever:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: retriever
      TERM: xterm-256color
      HISTORY_MESSAGES: 2
      MIN_SIMILARITIES: 2
      MAX_SIMILARITIES: 5
      COSINE_LIMIT: 0.55
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
      OPTION_TEMPERATURE: 0.0
      OPTION_TOP_P: 0.9
      OPTION_PRESENCE_PENALTY: 2.2
      CONTENT_PATH: /app/data
      INDEX_STATE_FILE: /app/state/.index-state.json
      CHAT_HISTORY_DIR: /app/state/chat-history
    volumes:
      - ./data:/app/data
      - rag_state:/app/state
    stdin_open: true
    tty: true
    configs:
      - source: guardrails.md
        target: /app/guardrails.md
    models:
      chat-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_CHAT
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
    depends_on:
      - qdrant

  embedder:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ROLE: embedder
      CONTENT_PATH: /app/data
      INDEX_STATE_FILE: /app/state/.index-state.json
      EMBED_INTERVAL_SECONDS: 15
      CHUNK_SIZE: 600
      CHUNK_OVERLAP: 100
      MAX_EMBEDDING_CHARS: 400
      PDF_MIN_EXTRACTED_CHARS: 100
    volumes:
      - ./data:/app/data
      - rag_state:/app/state
    models:
      embedding-model:
        endpoint_var: MODEL_RUNNER_BASE_URL
        model_var: MODEL_RUNNER_LLM_EMBEDDING
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  rag_state:

models:
  chat-model:
   model: hf.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M
  embedding-model:
    model: ai/embeddinggemma:latest

configs:
  guardrails.md:
    file: ./guardrails.md
